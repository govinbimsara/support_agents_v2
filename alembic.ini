# Alembic logging configuration only.
#
# Alembic settings live in pyproject.toml ([tool.alembic]). There is deliberately no
# sqlalchemy.url here: migrations/env.py takes the database URL from the
# DATABASE_URL_DIRECT environment variable (ADR-0014, NFR-REL-04), so no connection
# string ever sits in a file in the repo. Keep it that way.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

# Keep sqlalchemy.engine at WARNING or higher: INFO/DEBUG logs every statement and can
# expose connection details and data.
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
