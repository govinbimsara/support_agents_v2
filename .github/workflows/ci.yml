name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# Steps are guarded with a "detect" step so CI is green on an empty repo and
# switches on automatically as files appear (job-level `if` cannot see the workspace).
jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-and-unit:            # SDD 25.3 steps 1-5
    runs-on: ubuntu-latest
    outputs:
      has_py: ${{ steps.detect.outputs.has_py }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          [ -f pyproject.toml ] && echo "has_py=true" >> "$GITHUB_OUTPUT" || echo "has_py=false" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v5
        if: steps.detect.outputs.has_py == 'true'
      - run: uv sync --frozen
        if: steps.detect.outputs.has_py == 'true'
      - name: Lint and format check
        if: steps.detect.outputs.has_py == 'true'
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check (core modules)
        if: steps.detect.outputs.has_py == 'true'
        run: uv run mypy app/sessions app/tools app/guardrails app/kb
      - name: Unit tests
        if: steps.detect.outputs.has_py == 'true'
        run: uv run pytest -m unit
      - name: Validate flow YAML
        if: steps.detect.outputs.has_py == 'true' && hashFiles('scripts/validate_flows.py') != ''
        run: uv run python scripts/validate_flows.py
      - name: Prompt version check (FR-AGT-11)
        if: steps.detect.outputs.has_py == 'true' && hashFiles('scripts/check_prompts.py') != ''
        run: uv run python scripts/check_prompts.py
      - name: Config check (dev, demo, prod)
        if: steps.detect.outputs.has_py == 'true' && hashFiles('scripts/check_config.py') != ''
        run: uv run python scripts/check_config.py

  integration:              # SDD 25.3 step 6. Needs repo secrets NEON_API_KEY, NEON_PROJECT_ID
    runs-on: ubuntu-latest
    needs: lint-and-unit
    # skip on fork PRs (no secrets) and when there is no Python project yet
    if: ${{ needs.lint-and-unit.outputs.has_py == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@v4
      - name: Create temporary Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ci-${{ github.run_id }}
      - uses: astral-sh/setup-uv@v5
      - name: Integration tests
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}
        run: uv sync --frozen && uv run pytest -m integration
      - name: Delete Neon branch
        if: ${{ always() && steps.neon.outcome == 'success' }}
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.neon.outputs.branch_id }}

  images:                   # SDD 25.3 step 7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images and assert /ops is absent (NFR-SEC-08)
        run: |
          shopt -s nullglob
          files=(Dockerfile* docker/Dockerfile*)
          [ ${#files[@]} -eq 0 ] && { echo "no Dockerfiles yet"; exit 0; }
          for f in "${files[@]}"; do
            tag="check-$(echo "$f" | tr '/.' '--' | tr 'A-Z' 'a-z')"
            docker build -f "$f" -t "$tag" .
            if docker run --rm --entrypoint sh "$tag" -c 'test -e /ops || test -e /app/ops'; then
              echo "::error::/ops present in image built from $f"; exit 1
            fi
          done
  # Deploy (SDD 25.3 step 8: dev on merge, demo/prod by manual promotion) is added once the
  # Railway service exists. Do not add deploy tokens before then.
