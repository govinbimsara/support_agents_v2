[project]
name = "support-agents-v2"
version = "0.1.0"
description = "Genie Business support agent POC: chat + voice support for Dialog Pay Business merchants."
readme = "README.md"
license = "Apache-2.0"
# Pinned to one minor version. 3.14 is the newest version supported by every planned
# runtime dependency (google-adk 2.13, livekit-agents, onnxruntime, psycopg, asyncpg,
# pgvector); livekit-agents caps at <3.15 and onnxruntime has no cp315 wheels yet.
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.163.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 100
# .claude/ holds Claude Code tooling (hooks, skills), not application code.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers -ra"
markers = [
    "unit: fast tests with no network access",
    "integration: tests against a temporary Neon branch and a test S3 prefix",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]
